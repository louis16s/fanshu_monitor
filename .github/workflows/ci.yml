name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Test, build, and analyze Direct app
    runs-on: macos-26
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Select toolchain
        run: |
          set -euo pipefail
          for developer_dir in \
            /Applications/Xcode_26.6.app/Contents/Developer \
            /Applications/Xcode.app/Contents/Developer; do
            if [[ -d "$developer_dir" ]]; then
              sudo xcode-select --switch "$developer_dir"
              break
            fi
          done
          test "$(xcode-select -p)" = /Applications/Xcode_26.6.app/Contents/Developer \
            || test "$(xcode-select -p)" = /Applications/Xcode.app/Contents/Developer
          xcodebuild -version

      - name: Run unit tests
        run: |
          set -euo pipefail
          xcodebuild \
            -project '番薯monitor.xcodeproj' \
            -scheme '番薯Monitor' \
            -configuration Debug \
            -destination 'platform=macOS,arch=arm64' \
            -parallel-testing-enabled NO \
            -only-testing:FanshuMonitorTests \
            -resultBundlePath "$RUNNER_TEMP/FanshuMonitorTests.xcresult" \
            CODE_SIGNING_ALLOWED=NO \
            test 2>&1 | tee "$RUNNER_TEMP/FanshuMonitorTests.log"

      - name: Upload test diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unit-test-diagnostics
          path: |
            ${{ runner.temp }}/FanshuMonitorTests.log
            ${{ runner.temp }}/FanshuMonitorTests.xcresult
          if-no-files-found: warn
          retention-days: 7

      - name: Build Direct app
        run: |
          set -o pipefail
          xcodebuild \
            -project '番薯monitor.xcodeproj' \
            -target FanshuMonitorDirect \
            -configuration Debug \
            -destination 'platform=macOS,arch=arm64' \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Build Direct UI test bundle
        run: |
          set -o pipefail
          xcodebuild \
            -project '番薯monitor.xcodeproj' \
            -scheme '番薯Monitor UI Tests' \
            -configuration Debug \
            -destination 'platform=macOS,arch=arm64' \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGNING_REQUIRED=NO \
            build-for-testing

      - name: Run UI smoke tests
        run: |
          set -euo pipefail
          xcodebuild \
            -project '番薯monitor.xcodeproj' \
            -scheme '番薯Monitor UI Tests' \
            -configuration Debug \
            -destination 'platform=macOS,arch=arm64' \
            -parallel-testing-enabled NO \
            -resultBundlePath "$RUNNER_TEMP/FanshuMonitorUITests.xcresult" \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGNING_REQUIRED=NO \
            test 2>&1 | tee "$RUNNER_TEMP/FanshuMonitorUITests.log"

      - name: Upload UI test diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ui-test-diagnostics
          path: |
            ${{ runner.temp }}/FanshuMonitorUITests.log
            ${{ runner.temp }}/FanshuMonitorUITests.xcresult
          if-no-files-found: warn
          retention-days: 7

      - name: Analyze Direct app
        run: |
          set -o pipefail
          xcodebuild \
            -project '番薯monitor.xcodeproj' \
            -target FanshuMonitorDirect \
            -configuration Debug \
            -destination 'platform=macOS,arch=arm64' \
            CODE_SIGNING_ALLOWED=NO \
            analyze
