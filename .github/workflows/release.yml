name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    name: Build and release
    runs-on: macos-26
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          sw_vers
          xcodebuild -version

      - name: Build Release app
        run: |
          set -euo pipefail
          xcodebuild \
            -project '番薯monitor.xcodeproj' \
            -scheme '番薯Monitor' \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -archivePath 'build/番薯Monitor.xcarchive' \
            CODE_SIGN_IDENTITY='-' \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            archive

      - name: Package zip
        run: |
          set -euo pipefail
          APP_PATH='build/番薯Monitor.xcarchive/Products/Applications/番薯Monitor.app'
          test -d "$APP_PATH"

          mkdir -p build/release
          ditto -c -k --keepParent "$APP_PATH" 'build/release/FanshuMonitor.zip'
          shasum -a 256 'build/release/FanshuMonitor.zip' > 'build/release/checksums.txt'
          ls -lh build/release

      - name: Remove old release assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          release_api="https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/tags/${GITHUB_REF_NAME}"
          release_json="$(mktemp)"
          if ! curl -fsSL \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "$release_api" > "$release_json"; then
            echo "No existing release assets to remove."
            exit 0
          fi

          python3 - "$release_json" <<'PY' | while read -r asset_id asset_name; do
          import json
          import sys

          with open(sys.argv[1], "r", encoding="utf-8") as handle:
              release = json.load(handle)

          for asset in release.get("assets", []):
              print(asset["id"], asset["name"])
          PY
            echo "Deleting old asset: ${asset_name}"
            curl -fsSL -X DELETE \
              -H "Authorization: Bearer ${GITHUB_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/assets/${asset_id}"
          done

      - name: Create release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/release/FanshuMonitor.zip
            build/release/checksums.txt
          body_path: RELEASE_NOTES.md
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
