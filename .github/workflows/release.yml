name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    name: Build and release
    runs-on: macos-26
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          sw_vers
          xcodebuild -version

      - name: Build Release app
        run: |
          set -euo pipefail
          xcodebuild \
            -project '番薯monitor.xcodeproj' \
            -scheme '番薯Monitor' \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -archivePath 'build/番薯Monitor.xcarchive' \
            CODE_SIGN_IDENTITY='-' \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            archive

      - name: Package zip
        run: |
          set -euo pipefail
          APP_PATH='build/番薯Monitor.xcarchive/Products/Applications/番薯Monitor.app'
          test -d "$APP_PATH"

          mkdir -p build/release
          ditto -c -k --keepParent "$APP_PATH" 'build/release/FanshuMonitor.zip'
          shasum -a 256 'build/release/FanshuMonitor.zip' > 'build/release/checksums.txt'
          ls -lh build/release

      - name: Create release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/release/FanshuMonitor.zip
            build/release/checksums.txt
          body_path: RELEASE_NOTES.md
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
