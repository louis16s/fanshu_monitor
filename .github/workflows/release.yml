name: Release

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-release:
    name: Build and release
    runs-on: macos-26
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Select toolchain
        run: |
          set -euo pipefail
          if [[ -d /Applications/Xcode_26.5.app ]]; then
            sudo xcode-select --switch /Applications/Xcode_26.5.app/Contents/Developer
          fi
          sw_vers
          xcodebuild -version

      - name: Verify tag matches app version
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          tag_version="${TAG_NAME#v}"
          app_version="$(
            xcodebuild \
              -project '番薯monitor.xcodeproj' \
              -scheme '番薯Monitor' \
              -configuration Release \
              -showBuildSettings |
              awk '/ MARKETING_VERSION = / { print $3; exit }'
          )"
          test -n "$app_version"
          if [[ "$tag_version" != "$app_version" ]]; then
            echo "Tag version ${tag_version} does not match MARKETING_VERSION ${app_version}" >&2
            exit 1
          fi

      - name: Run tests
        run: |
          set -uo pipefail
          mkdir -p build
          xcodebuild \
            -project '番薯monitor.xcodeproj' \
            -scheme '番薯Monitor' \
            -configuration Debug \
            -destination 'platform=macOS,arch=arm64' \
            -parallel-testing-enabled NO \
            CODE_SIGNING_ALLOWED=NO \
            test 2>&1 | tee build/test.log
          test_status="${PIPESTATUS[0]}"
          if [[ "$test_status" -ne 0 ]]; then
            python3 - <<'PY'
          from pathlib import Path

          lines = Path("build/test.log").read_text(errors="replace").splitlines()
          markers = (" error:", "failed", "failure", "Testing failed", "TEST FAILED")
          selected = [line.strip() for line in lines if any(marker.lower() in line.lower() for marker in markers)]
          summary = " | ".join(selected[-20:])[-6000:] or "xcodebuild test failed without a matching summary line"
          summary = summary.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
          print(f"::error file=.github/workflows/release.yml,line=49::{summary}")
          PY
            exit "$test_status"
          fi

      - name: Build Release app
        run: |
          set -euo pipefail
          xcodebuild \
            -project '番薯monitor.xcodeproj' \
            -scheme '番薯Monitor' \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -archivePath 'build/番薯Monitor.xcarchive' \
            CODE_SIGN_IDENTITY='-' \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            archive

      - name: Package zip
        run: |
          set -euo pipefail
          APP_PATH='build/番薯Monitor.xcarchive/Products/Applications/番薯Monitor.app'
          test -d "$APP_PATH"

          codesign --force --deep --sign - "$APP_PATH"
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"

          mkdir -p build/release
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" 'build/release/FanshuMonitor.zip'
          (
            cd build/release
            shasum -a 256 'FanshuMonitor.zip' > 'checksums.txt'
          )
          ls -lh build/release

      - name: Create release manifest
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          artifact = Path("build/release/FanshuMonitor.zip")
          manifest = {
              "schema": 1,
              "product": "番薯Monitor",
              "version": os.environ["RELEASE_VERSION"].removeprefix("v"),
              "sourceCommit": os.environ["SOURCE_COMMIT"],
              "artifact": {
                  "name": artifact.name,
                  "sha256": hashlib.sha256(artifact.read_bytes()).hexdigest(),
              },
          }
          Path("build/release/release-manifest.json").write_text(
              json.dumps(manifest, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Remove old release assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          release_api="https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/tags/${GITHUB_REF_NAME}"
          release_json="$(mktemp)"
          if ! curl -fsSL \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "$release_api" > "$release_json"; then
            echo "No existing release assets to remove."
            exit 0
          fi

          python3 - "$release_json" <<'PY' | while read -r asset_id asset_name; do
          import json
          import sys

          with open(sys.argv[1], "r", encoding="utf-8") as handle:
              release = json.load(handle)

          for asset in release.get("assets", []):
              print(asset["id"], asset["name"])
          PY
            echo "Deleting old asset: ${asset_name}"
            curl -fsSL -X DELETE \
              -H "Authorization: Bearer ${GITHUB_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/assets/${asset_id}"
          done

      - name: Create release and upload assets
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: |
            build/release/FanshuMonitor.zip
            build/release/checksums.txt
            build/release/release-manifest.json
          body_path: docs/RELEASE_NOTES.md
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
