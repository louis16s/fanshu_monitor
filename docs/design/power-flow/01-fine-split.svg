<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 180" role="img" aria-labelledby="title desc">
<title id="title">细线分流 · 功率分流</title><desc id="desc">适配器输入48瓦，系统使用32瓦，电池充电16瓦。箭头与流动标记表示输入到系统和电池的方向。</desc>
<style>
:root{--text:#202831;--muted:#64717e;--track:#dce3e8;--surface:#f7f9fb;--input:#108b77;--system:#347de2;--battery:#b87c0b}
@media(prefers-color-scheme:dark){:root{--text:#edf2f6;--muted:#a0adb8;--track:#35414b;--surface:#21292f;--input:#45ceb0;--system:#7daaff;--battery:#eaba58}}
svg{background:var(--surface)}text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:var(--text);letter-spacing:0}
.label{font-size:17px;fill:var(--muted)}.value{font-size:22px;font-weight:600;font-variant-numeric:tabular-nums}.minor{font-size:13px;fill:var(--muted)}
.line{fill:none;stroke-linecap:round;stroke-linejoin:round}.input{stroke:var(--input)}.system{stroke:var(--system)}.battery{stroke:var(--battery)}
.flow{stroke-dasharray:5 27;animation:flow 2.4s linear infinite}
@keyframes flow{to{stroke-dashoffset:-96}}
@media(prefers-reduced-motion:reduce){.flow,.bandflow{animation:none}}
</style>
<defs>
<g id="plug" fill="none" stroke="var(--input)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 0v6m8-6v6M2 6h14v4a7 7 0 0 1-7 7v5M0 9h2m14 0h2"/></g>
<g id="screen" fill="none" stroke="var(--system)" stroke-width="2" stroke-linecap="round"><rect width="23" height="15" rx="2"/><path d="M11.5 15v5m-6 0h12"/></g>
<g id="battery" fill="none" stroke="var(--battery)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="23" height="13" rx="3"/><path d="M25 4v5m-13-8-4 6h5l-3 5"/></g>
</defs>

<path class="line input" stroke-width="2.4" opacity=".38" d="M160 90H238"/>
<path class="line system" stroke-width="2.4" opacity=".38" d="M238 90C300 90 316 52 396 52"/>
<path class="line battery" stroke-width="2.4" opacity=".38" d="M238 90C300 90 316 136 396 136"/>
<path class="line input flow" stroke-width="3.4" d="M160 90H238"/>
<path class="line system flow" stroke-width="3.4" d="M238 90C300 90 316 52 396 52"/>
<path class="line battery flow" stroke-width="3.4" d="M238 90C300 90 316 136 396 136"/>
<circle cx="238" cy="90" r="5" fill="var(--surface)" stroke="var(--input)" stroke-width="1.8"/>
<path class="line system" stroke-width="2" d="m390 47 7 5-7 5"/>
<path class="line battery" stroke-width="2" d="m390 131 7 5-7 5"/>
<use href="#plug" x="14" y="76"/><text class="label" x="46" y="80">输入</text><text class="value" x="46" y="107">48.0 W</text>
<use href="#screen" x="414" y="32"/><text class="label" x="448" y="46">系统</text><text class="value" x="448" y="73">32.0 W</text>
<use href="#battery" x="414" y="118"/><text class="label" x="448" y="130">充电</text><text class="value" x="448" y="157">16.0 W</text>
</svg>
