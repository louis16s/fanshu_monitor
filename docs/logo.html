<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>番薯Monitor Logo</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f5f7fb;
      --text: #17202a;
      --muted: #667085;
      --panel: rgba(255, 255, 255, 0.74);
      --line: rgba(32, 44, 57, 0.12);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0d1218;
        --text: #edf3f8;
        --muted: #9aa8b5;
        --panel: rgba(18, 25, 32, 0.78);
        --line: rgba(255, 255, 255, 0.12);
      }
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at 24% 20%, rgba(42, 228, 173, 0.18), transparent 32rem),
        radial-gradient(circle at 74% 72%, rgba(255, 117, 76, 0.14), transparent 28rem),
        var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", sans-serif;
    }

    main {
      width: min(960px, calc(100vw - 48px));
      display: grid;
      grid-template-columns: minmax(280px, 420px) 1fr;
      gap: 44px;
      align-items: center;
      padding: 44px;
      border: 1px solid var(--line);
      border-radius: 32px;
      background: var(--panel);
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.16);
      backdrop-filter: blur(28px);
    }

    .preview {
      display: grid;
      place-items: center;
      aspect-ratio: 1;
      border-radius: 32px;
      background: linear-gradient(145deg, rgba(255, 255, 255, 0.58), rgba(255, 255, 255, 0.12));
      border: 1px solid var(--line);
    }

    svg {
      width: min(72vw, 320px);
      height: auto;
      display: block;
      filter: drop-shadow(0 24px 36px rgba(0, 0, 0, 0.24));
    }

    h1 {
      margin: 0;
      font-size: clamp(32px, 5vw, 56px);
      line-height: 1;
      letter-spacing: 0;
    }

    p {
      margin: 16px 0 0;
      max-width: 36rem;
      color: var(--muted);
      font-size: 16px;
      line-height: 1.7;
    }

    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 26px;
    }

    .chip {
      padding: 8px 12px;
      border: 1px solid var(--line);
      border-radius: 999px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 600;
      background: rgba(255, 255, 255, 0.24);
    }

    @media (max-width: 760px) {
      main {
        grid-template-columns: 1fr;
        padding: 28px;
      }
    }
  </style>
</head>
<body>
  <main>
    <section class="preview" aria-label="番薯Monitor logo preview">
      <svg viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc" xmlns="http://www.w3.org/2000/svg">
        <title id="title">番薯Monitor Logo</title>
        <desc id="desc">深色圆角 macOS 图标，包含暖橙番薯主体、青绿色监控脉冲和小亮度点</desc>
        <defs>
          <linearGradient id="icon-bg" x1="18%" y1="10%" x2="86%" y2="92%">
            <stop offset="0%" stop-color="#090e16"/>
            <stop offset="54%" stop-color="#0a3438"/>
            <stop offset="100%" stop-color="#061f29"/>
          </linearGradient>
          <radialGradient id="glow" cx="36%" cy="34%" r="62%">
            <stop offset="0%" stop-color="#38f0bd" stop-opacity=".26"/>
            <stop offset="56%" stop-color="#1c7fdd" stop-opacity=".08"/>
            <stop offset="100%" stop-color="#1c7fdd" stop-opacity="0"/>
          </radialGradient>
          <linearGradient id="potato" x1="28%" y1="72%" x2="78%" y2="24%">
            <stop offset="0%" stop-color="#ff9e46"/>
            <stop offset="52%" stop-color="#f64e65"/>
            <stop offset="100%" stop-color="#6b3cb0"/>
          </linearGradient>
          <filter id="soft-shadow" x="-30%" y="-30%" width="160%" height="160%">
            <feDropShadow dx="0" dy="24" stdDeviation="32" flood-color="#000" flood-opacity=".28"/>
          </filter>
          <filter id="mint-glow" x="-50%" y="-50%" width="200%" height="200%">
            <feDropShadow dx="0" dy="0" stdDeviation="12" flood-color="#49f2af" flood-opacity=".42"/>
          </filter>
        </defs>

        <rect x="56" y="56" width="912" height="912" rx="220" fill="url(#icon-bg)" filter="url(#soft-shadow)"/>
        <rect x="56" y="56" width="912" height="912" rx="220" fill="none" stroke="#ffffff" stroke-opacity=".16" stroke-width="8"/>
        <circle cx="512" cy="512" r="330" fill="url(#glow)"/>

        <path d="M287 420C225 583 361 819 594 783C806 750 874 561 809 457C738 341 636 245 430 285C316 308 242 312 287 420Z" fill="url(#potato)" filter="url(#soft-shadow)"/>
        <path d="M415 604C457 706 539 711 621 642" fill="#251530" fill-opacity=".16"/>
        <path d="M420 600C463 500 548 494 593 552" fill="none" stroke="#fff" stroke-opacity=".44" stroke-width="32" stroke-linecap="round"/>

        <path d="M266 383H404C440 383 445 481 486 481H625C661 481 671 565 709 565H791" fill="none" stroke="#2eeab1" stroke-width="36" stroke-linecap="round" stroke-linejoin="round" filter="url(#mint-glow)"/>

        <g filter="url(#mint-glow)">
          <circle cx="740" cy="722" r="40" fill="#baffb6"/>
          <path d="M740 638v-58M740 864v-58M656 722h-58M882 722h-58M680 662l-41-41M840 822l-41-41M680 782l-41 41M840 622l-41 41" stroke="#baffb6" stroke-opacity=".44" stroke-width="13" stroke-linecap="round"/>
        </g>
      </svg>
    </section>

    <section>
      <h1>番薯Monitor</h1>
      <p>新图标只保留一个强记忆点：暖橙番薯主体。青绿色折线表达实时监控，右上亮度点暗示屏幕亮度控制。整体减少线框和大环，小尺寸下更清楚，也更像一个正式的 macOS App 图标。</p>
      <div class="chips" aria-label="logo keywords">
        <span class="chip">macOS</span>
        <span class="chip">Monitor</span>
        <span class="chip">Display</span>
        <span class="chip">Sweet Potato</span>
      </div>
    </section>
  </main>
</body>
</html>
