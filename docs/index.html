<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>番薯Monitor</title>
  <meta name="description" content="番薯Monitor 是面向 Apple Silicon 的 macOS 菜单栏系统监控与外接显示器控制工具。">
  <link rel="icon" type="image/png" href="images/icon-128.png" sizes="128x128">
  <script>
    (function () {
      try {
        const stored = localStorage.getItem("fanshu-lang");
        if (stored === "zh" || stored === "en") {
          location.replace("./" + stored + "/");
          return;
        }
      } catch (error) {}
      const lang = navigator.language || navigator.userLanguage || "";
      location.replace(lang.toLowerCase().startsWith("zh") ? "./zh/" : "./en/");
    })();
  </script>
</head>
<body>
  <p><a href="zh/">中文</a> · <a href="en/">English</a></p>
</body>
</html>
